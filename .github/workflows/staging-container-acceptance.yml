name: Staging container acceptance

on:
  push:
    branches:
      - codex/cloud-run-staging

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify clean source and Docker context exclusions
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test ! -e .env
          test ! -e .data

          # Harmless markers exercise the actual .dockerignore during COPY .
          printf 'dummy-context-marker\n' > .env
          mkdir -p .data src/.data node_modules build
          printf 'dummy-context-marker\n' > .data/local.json
          printf 'dummy-context-marker\n' > src/.data/local.json
          printf 'dummy-context-marker\n' > src/.env.local
          printf 'dummy-context-marker\n' > static/.env.local
          printf 'dummy-context-marker\n' > credentials.json
          printf 'dummy-context-marker\n' > browser-storage.json
          printf 'dummy-context-marker\n' > node_modules/local.txt
          printf 'dummy-context-marker\n' > build/local.txt

          docker build --progress=plain --tag nts-staging-context-probe --file - . <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          COPY . /context
          RUN set -eu; \
              test -f /context/Dockerfile; \
              test -f /context/src/hooks.server.ts; \
              for path in .env .data/local.json src/.data/local.json src/.env.local static/.env.local credentials.json browser-storage.json node_modules/local.txt build/local.txt .git/config; do \
                test ! -e "/context/$path"; \
              done; \
              if find /context -type f \( -name '.env*' -o -name '*credential*' -o -name '*.pem' -o -name '*.key' -o -name '*.sqlite' -o -name '*backup*.json' -o -name '*browser*.json' \) -print | grep -q .; then \
                echo 'Unexpected sensitive file in Docker build context' >&2; \
                exit 1; \
              fi
          DOCKERFILE

      - name: Build committed Dockerfile and inspect runtime image
        shell: bash
        run: |
          set -euo pipefail
          image="nts-staging-accept:${GITHUB_SHA}"
          docker build --progress=plain --tag "$image" --file Dockerfile .
          if docker image inspect --format '{{json .Config.Env}}' "$image" |
            grep -Eq 'SPOTIFY_CLIENT_ID=|SPOTIFY_CLIENT_SECRET=|STAGING_SESSION_SECRET='; then
            echo 'Runtime image contains a credential setting' >&2
            exit 1
          fi
          docker run --rm --entrypoint sh "$image" -ec '
            test -f /app/build/index.js
            test -f /app/scripts/start-cloud-run.mjs
            for path in .env .data .git src static Dockerfile credentials.json browser-storage.json; do
              test ! -e "/app/$path"
            done
            if find /app/build -type f \( -name ".env*" -o -name "*credential*" -o -name "*.pem" -o -name "*.key" -o -name "*backup*.json" -o -name "*browser*.json" \) -print | grep -q .; then
              echo "Unexpected sensitive file in runtime build" >&2
              exit 1
            fi
          '

      - name: Exercise dummy container over loopback only
        shell: bash
        run: |
          set -euo pipefail
          image="nts-staging-accept:${GITHUB_SHA}"
          canonical_host='nts2spotify.vincentvanderveken.com'
          container=''
          cleanup() {
            if [ -n "$container" ]; then docker rm -f "$container" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          container=$(docker run --detach --rm --publish 127.0.0.1::8080 \
            --env PORT=8080 \
            --env SPOTIFY_CLIENT_ID=dummy-client \
            --env SPOTIFY_CLIENT_SECRET=dummy-secret \
            --env STAGING_SPOTIFY_USER_ID=dummy-owner \
            --env STAGING_SESSION_SECRET=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            "$image")
          address=$(docker port "$container" 8080/tcp)
          test "${address#127.0.0.1:}" != "$address"
          base="http://$address"

          status='000'
          for attempt in $(seq 1 30); do
            status=$(curl --silent --max-time 2 --output /tmp/nts-root.html \
              --write-out '%{http_code}' --header "Host: $canonical_host" "$base/" || true)
            if [ "$status" = 200 ]; then break; fi
            sleep 1
          done
          test "$status" = 200
          grep -q 'Private NTS to Spotify staging' /tmp/nts-root.html

          code=$(curl --silent --max-time 5 --output /dev/null --write-out '%{http_code}' \
            --header 'Host: other.example' "$base/")
          test "$code" = 400
          for path in /api/nts/catalogue /api/nts/matches /api/spotify/playlist /shows/example; do
            code=$(curl --silent --max-time 5 --output /dev/null --write-out '%{http_code}' \
              --header "Host: $canonical_host" "$base$path")
            test "$code" = 401
          done
          code=$(curl --silent --max-time 5 --output /dev/null --write-out '%{http_code}' \
            --request POST --header "Host: $canonical_host" "$base/api/nts/matches")
          test "$code" = 403

          docker stop --time 10 "$container" >/dev/null
          container=''
          if curl --silent --max-time 2 --output /dev/null "$base/"; then
            echo 'Container port remained reachable after shutdown' >&2
            exit 1
          fi
          echo 'Container startup, Host checks, route protection and shutdown passed.'
